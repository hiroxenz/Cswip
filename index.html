<!DOCTYPE html>
<html>
<head>
  <title>CAPTCHA Dashboard & Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-xl font-bold mb-4">CAPTCHA Monitoring & Tester</h1>

<!-- CREATE CAPTCHA -->
<div class="mb-6 p-4 border rounded bg-gray-50 max-w-xl">
  <h2 class="text-lg font-semibold mb-2">Create CAPTCHA</h2>
  <button id="create-captcha" class="px-4 py-2 bg-blue-500 text-white rounded">Create CAPTCHA</button>
  <div id="new-captcha" class="mt-2"></div>
</div>

<!-- REFRESH BUTTON -->
<div class="mb-4">
  <button id="refresh-data" class="px-4 py-2 bg-green-500 text-white rounded">Refresh Data</button>
</div>

<!-- CHART -->
<div class="mb-6">
  <canvas id="chart" class="w-full max-w-xl" style="height:300px;"></canvas>
</div>

<!-- LATEST CAPTCHA TABLE -->
<h2 class="text-lg font-semibold mb-2">Latest CAPTCHAs</h2>
<table class="table-auto border border-gray-300 w-full max-w-xl">
  <thead>
    <tr class="bg-gray-200">
      <th class="px-2 py-1 border">ID</th>
      <th class="px-2 py-1 border">IP</th>
      <th class="px-2 py-1 border">Status</th>
      <th class="px-2 py-1 border">Created</th>
    </tr>
  </thead>
  <tbody id="captcha-table"></tbody>
</table>

<script>
async function fetchData(){
  const res = await fetch("/api/dashboard");
  const data = await res.json();
  return data.monitor; // array of latest CAPTCHAs
}

function updateChart(chart, monitor){
  // contoh: hitung jumlah solved vs pending
  const counts = { solved:0, pending:0 };
  monitor.forEach(item => {
    if(item.solved) counts.solved++;
    else counts.pending++;
  });
  chart.data.labels = Object.keys(counts);
  chart.data.datasets[0].data = Object.values(counts);
  chart.update();
}

function updateTable(monitor){
  const tbody = document.getElementById("captcha-table");
  tbody.innerHTML = "";
  monitor.slice(-20).reverse().forEach(item=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="px-2 py-1 border">${item.captcha_id}</td>
      <td class="px-2 py-1 border">${item.ip || '-'}</td>
      <td class="px-2 py-1 border">${item.solved ? 'Solved' : 'Pending'}</td>
      <td class="px-2 py-1 border">${new Date(item.created).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

// CREATE CAPTCHA BUTTON
document.getElementById("create-captcha").addEventListener("click", async ()=>{
  const res = await fetch("/api/captcha/create", { method:"POST" });
  const data = await res.json();
  if(data.ok){
    const div = document.getElementById("new-captcha");
    div.innerHTML = `
      <div class="p-2 border rounded bg-white mt-2">
        <p><strong>ID:</strong> ${data.captcha_id}</p>
        <p><a href="/api/captcha/view?id=${data.captcha_id}" target="_blank" class="text-blue-600 underline">Test CAPTCHA</a></p>
      </div>
    `;
  } else {
    alert("Failed to create CAPTCHA");
  }
});

// REFRESH DATA BUTTON
document.getElementById("refresh-data").addEventListener("click", async ()=>{
  const monitor = await fetchData();
  updateChart(chart, monitor);
  updateTable(monitor);
});

// INITIAL CHART SETUP
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx,{
  type:'bar',
  data:{ labels:[], datasets:[{label:'CAPTCHA Status', data:[], backgroundColor:['#4ade80','#f87171']}] },
  options:{ responsive:true, maintainAspectRatio:false }
});

// load initial data
(async ()=>{
  const monitor = await fetchData();
  updateChart(chart, monitor);
  updateTable(monitor);
})();
</script>

</body>
</html>
