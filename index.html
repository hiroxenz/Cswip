<!DOCTYPE html>
<html>
<head>
  <title>CAPTCHA Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5">

<h1 class="text-xl font-bold mb-4">CAPTCHA Monitoring</h1>

<div class="mb-6">
  <canvas id="chart" class="w-full max-w-xl" style="height:300px;"></canvas>
</div>

<h2 class="text-lg font-semibold mb-2">Latest CAPTCHAs</h2>
<table class="table-auto border border-gray-300 w-full max-w-xl">
  <thead>
    <tr class="bg-gray-200">
      <th class="px-2 py-1 border">ID</th>
      <th class="px-2 py-1 border">Token</th>
      <th class="px-2 py-1 border">Status</th>
      <th class="px-2 py-1 border">IP</th>
      <th class="px-2 py-1 border">Time</th>
    </tr>
  </thead>
  <tbody id="captcha-table">
    <!-- rows added dynamically -->
  </tbody>
</table>

<script>
async function fetchData(){
  const res = await fetch("/api/dashboard");
  const data = await res.json();
  return data.monitor;
}

// update chart
function updateChart(chart, monitor){
  const counts = monitor.reduce((acc,item)=>{
    acc[item.type] = (acc[item.type]||0)+1;
    return acc;
  }, {});
  chart.data.labels = Object.keys(counts);
  chart.data.datasets[0].data = Object.values(counts);
  chart.update();
}

// update table
function updateTable(monitor){
  const tbody = document.getElementById("captcha-table");
  tbody.innerHTML = "";

  monitor.slice(-20).reverse().forEach(item=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="px-2 py-1 border">${item.captcha_id || '-'}</td>
      <td class="px-2 py-1 border">${item.token || '-'}</td>
      <td class="px-2 py-1 border">${item.type}</td>
      <td class="px-2 py-1 border">${item.ip || '-'}</td>
      <td class="px-2 py-1 border">${new Date(item.timestamp).toLocaleTimeString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

(async ()=>{
  const ctx = document.getElementById('chart').getContext('2d');
  const chart = new Chart(ctx,{
    type:'bar',
    data:{ labels:[], datasets:[{label:'Captcha Actions', data:[], backgroundColor:['#4ade80','#f87171']}] },
    options:{ responsive:true, maintainAspectRatio:false }
  });

  // update every second
  setInterval(async ()=>{
    const monitor = await fetchData();
    updateChart(chart, monitor);
    updateTable(monitor);
  },1000);
})();
</script>
</body>
</html>
